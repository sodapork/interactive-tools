<style type="text/css">
    /* Suggested basic styles, intended to be customized by user or auto-generated by your tool */
    .widget {
        font-family: Arial, sans-serif;
        color: #333;
        background-color: #fff;
        border: 1px solid #e5e5e5;
        box-sizing: border-box;
        radius:5px;
        padding: 10px;
    }
    .widget h1 {
        font-size: 20px;
        font-weight: bold;
        color: #333;
    }
    .widget button {
        border: none;
        border-radius: 5px;
        font-size: 14px;
        padding: 10px;
    }
    .widget select {
        margin: 5px;
        padding: 5px;
    }
    .widget .results {
        font-size: 14px;
        color: #666;
    }
    .widget .error {
        color: red;
        font-size: 12px;
    }
    .widget .tooltip {
        display: inline-block;
        position: relative;
        color: #888;
        cursor: help;
    }
    .widget .tooltip .tooltiptext {
        visibility: hidden;
        width: 120px;
        background-color: #333;
        color: #fff;
        text-align: center;
        border-radius: 6px;
        padding: 5px 0;
        position: absolute;
        z-index: 1;
        bottom: 125%; 
        left: 50%;
    }
    .widget .tooltip:hover .tooltiptext {
        visibility: visible;
    }
</style>

<div class="widget">
    <h1>Select a pet breed</h1>
    <div>
        <select id="petSelect">
            <option value="">--- Select ---</option>
            <option value="Persian Cat">Persian Cat</option>
            <option value="French Bulldog">French Bulldog</option>
            <option value="Poodle">Poodle</option>
            <!-- Add more pet breeds here -->
        </select>
        <button onclick="getPetInfo()">Get Info</button>
        <span class="tooltip">?
            <span class="tooltiptext">Select a breed to see its suitability for senior lifestyles</span>
        </span>
    </div>
    <div id="error" class="error"></div>
    <div id="results" class="results"></div>
</div>

<script type="text/javascript">
    const petsData = {
      "Persian Cat": "Low maintenance. Great for indoors.",
      "French Bulldog": "Easy to groom. Good with senior citizens.",
      "Poodle": "Intelligent and easy to train. Needs regular exercise.",
      // Add more pet info here
    }

    function getPetInfo() {
        const pet = document.getElementById("petSelect").value;
        const resultsDiv = document.getElementById("results");
        const errorDiv = document.getElementById("error");
        errorDiv.innerHTML = "";
        resultsDiv.innerHTML = "";

        if (pet) {
            resultsDiv.innerHTML = `<h2>${pet}</h2><p>${petsData[pet]}</p>`;
        } else {
            errorDiv.innerHTML = "Please select a pet breed.";
        }
    }
</script>
